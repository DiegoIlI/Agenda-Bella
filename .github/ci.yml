name: Pruebas y compilación

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validar archivos del proyecto
        run: npm run check
      - name: Pruebas unitarias (recordatorios)
        run: npm run test:unit
      - name: Compilar (modo demostración, sin credenciales)
        run: npm run build:demo
      - name: Guardar package-lock.json generado (súbelo al repositorio si no existe)
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
