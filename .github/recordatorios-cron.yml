# ALTERNATIVA gratuita a pg_cron: llama a la Edge Function cada 30 min desde GitHub Actions.
# Requiere los secrets REMINDERS_URL (https://TU_PROYECTO.supabase.co/functions/v1/appointment-reminders) y CRON_SECRET.
# GitHub puede retrasar tareas programadas varios minutos; para mayor puntualidad usa supabase/cron_recordatorios.sql.
name: Recordatorios (cron alternativo)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  llamar:
    if: ${{ vars.USAR_CRON_GITHUB == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la función
        env:
          URL: ${{ secrets.REMINDERS_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$URL" && test -n "$SECRET"
          curl --fail-with-body -sS -X POST -H "x-cron-secret: $SECRET" -H "Content-Type: application/json" -d '{}' "$URL"
