name: Pruebas y compilación

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validar archivos del proyecto
        run: npm run check
      - name: Pruebas unitarias (recordatorios)
        run: npm run test:unit
      - name: Compilar (modo demostración, sin credenciales)
        run: npm run build:demo
      - name: Recorrido completo en móvil y escritorio (modo demostración)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:4173/ && break; sleep 1; done
          npm run test:e2e
      - name: Guardar capturas del recorrido
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: tests/e2e/capturas/
          if-no-files-found: ignore
      - name: Compilar sitio web premium y ruta de reservas
        run: |
          npm run build:site
          test -f dist/index.html
          test -f dist/reservar/index.html
      - name: Guardar package-lock.json generado (súbelo al repositorio si no existe)
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
