name: Generar IPA de Agenda Bella para SideStore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa-sin-firma:
    name: Compilar IPA iOS sin firmar
    runs-on: macos-15
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Compilar React
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_BOOKING_URL: ${{ vars.VITE_PUBLIC_BOOKING_URL }}
        run: npm run build

      - name: Preparar proyecto nativo de iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Compilar aplicacion para iPhone sin firma
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AgendaBellaDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Empaquetar archivo IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AgendaBellaDerived/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/App.app
          zip -qry AgendaBella-unsigned.ipa Payload
          unzip -t AgendaBella-unsigned.ipa

      - name: Guardar IPA para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AgendaBella-IPA-SideStore
          path: AgendaBella-unsigned.ipa
          retention-days: 14
